server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 16m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 40s;
    }
    location /health { proxy_pass http://api:8000; }
    location /ready { proxy_pass http://api:8000; }
    location / { try_files $uri $uri/ /index.html; }
}
